<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2937">
  <title>Справочник оборудования</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <!-- Экран входа -->
    <section id="login-screen" class="screen" hidden>
      <h1>Справочник оборудования</h1>
      <form id="login-form">
        <label>Почта
          <input type="email" id="login-email" autocomplete="username" required>
        </label>
        <label>Пароль
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <button type="submit">Войти</button>
      </form>
      <button type="button" id="forgot-button" class="link">Забыли пароль?</button>
    </section>

    <!-- Экран установки пароля: после приглашения или сброса -->
    <section id="password-screen" class="screen" hidden>
      <h1>Придумайте пароль</h1>
      <form id="password-form">
        <label>Новый пароль (не короче 8 символов)
          <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit">Сохранить</button>
      </form>
    </section>

    <!-- Основной экран: пока заглушка, здесь будет список оборудования -->
    <section id="app-screen" class="screen" hidden>
      <header class="topbar">
        <span id="user-email"></span>
        <button type="button" id="logout-button" class="link">Выйти</button>
      </header>
      <h1>Оборудование</h1>
      <input type="search" id="search" placeholder="Поиск: название, производитель, модель" autocomplete="off">
      <div id="categories" class="chips">
        <button type="button" class="chip active" data-category="">все</button>
        <button type="button" class="chip" data-category="звук">звук</button>
        <button type="button" class="chip" data-category="свет">свет</button>
        <button type="button" class="chip" data-category="видео">видео</button>
        <button type="button" class="chip" data-category="сцена">сцена</button>
        <button type="button" class="chip" data-category="энергетика">энергетика</button>
        <button type="button" class="chip" data-category="спецэффекты">спецэффекты</button>
        <button type="button" class="chip" data-category="спецсвязь">спецсвязь</button>
        <button type="button" class="chip" data-category="прочее">прочее</button>
      </div>
      <p id="list-status"></p>
      <ul id="equipment-list"></ul>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
