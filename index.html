<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2937">
  <title>Справочник оборудования</title>
  <script>
    // Тема ставится до отрисовки страницы, чтобы не мигала.
    // themeChoice — что выбрал человек: light, dark или system (как в системе, по умолчанию);
    // theme — какая тема в итоге показана: light или dark
    (function () {
      let choice = 'system';
      try { choice = localStorage.getItem('theme') || 'system'; } catch (e) {}
      const dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.themeChoice = choice;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <!-- Шрифт Roboto — как в сметах Excel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <main>
    <!-- Экран входа -->
    <section id="login-screen" class="screen" hidden>
      <h1>Справочник оборудования</h1>
      <form id="login-form">
        <label>Почта
          <input type="email" id="login-email" autocomplete="username" required>
        </label>
        <label>Пароль
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <button type="submit">Войти</button>
      </form>
      <button type="button" id="forgot-button" class="link">Забыли пароль?</button>
    </section>

    <!-- Экран установки пароля: после приглашения или сброса -->
    <section id="password-screen" class="screen" hidden>
      <h1>Придумайте пароль</h1>
      <form id="password-form">
        <label>Новый пароль (не короче 8 символов)
          <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit">Сохранить</button>
      </form>
    </section>

    <!-- Основной экран: пока заглушка, здесь будет список оборудования -->
    <section id="app-screen" class="screen" hidden>
      <header class="topbar">
        <span id="user-email"></span>
        <button type="button" id="logout-button" class="link">Выйти</button>
      </header>
      <h1>Оборудование</h1>
      <input type="search" id="search" placeholder="Поиск" autocomplete="off">
      <div id="categories" class="chips"></div>
      <p id="list-status"></p>
      <div id="equipment-list"></div>
    </section>

    <p id="message" role="status"></p>
  </main>

  <!-- Пиктограммы тем: нарисованы один раз, дальше используются через <use> -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/>
    </symbol>
    <!-- «Как в системе»: экран ноутбука -->
    <symbol id="icon-system" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </svg>

  <!-- Выбор темы: кнопка показывает текущий выбор, по нажатию открывается меню из трёх пунктов -->
  <div id="theme-switcher">
    <div id="theme-menu" role="menu" hidden>
      <button type="button" role="menuitemradio" data-choice="light">
        <svg width="18" height="18"><use href="#icon-sun"/></svg>Светлая
      </button>
      <button type="button" role="menuitemradio" data-choice="dark">
        <svg width="18" height="18"><use href="#icon-moon"/></svg>Тёмная
      </button>
      <button type="button" role="menuitemradio" data-choice="system">
        <svg width="18" height="18"><use href="#icon-system"/></svg>Как в системе
      </button>
    </div>
    <button type="button" id="theme-button" aria-label="Тема оформления" aria-haspopup="menu">
      <svg class="icon-light" width="22" height="22"><use href="#icon-sun"/></svg>
      <svg class="icon-dark" width="22" height="22"><use href="#icon-moon"/></svg>
      <svg class="icon-system" width="22" height="22"><use href="#icon-system"/></svg>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
